<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Option 2: Gold & red circular design with 农历 (lunar calendar) -->
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b91c1c"/>
      <stop offset="100%" style="stop-color:#7f1d1d"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="80" fill="url(#bg2)"/>
  <!-- Decorative circle border -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#fbbf24" stroke-width="8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="170" fill="#7f1d1d" opacity="0.6"/>
  <!-- Moon crescent top -->
  <circle cx="256" cy="150" r="40" fill="#fbbf24"/>
  <circle cx="272" cy="140" r="35" fill="#b91c1c"/>
  <!-- Chinese characters 农历 (lunar calendar) -->
  <text x="256" y="280" text-anchor="middle" font-family="serif" font-size="100" font-weight="bold" fill="#fbbf24">农历</text>
  <!-- Small decorative dots -->
  <circle cx="160" cy="340" r="6" fill="#fbbf24" opacity="0.6"/>
  <circle cx="352" cy="340" r="6" fill="#fbbf24" opacity="0.6"/>
  <circle cx="256" cy="370" r="4" fill="#fbbf24" opacity="0.4"/>
</svg>
